shadow = true;
# Nested/software X servers (Xephyr, Xvfb, Xorg dummy) have no real vblank
# and unreliable Damage events. Fading + vsync + damage tracking there make
# picom stall or miss repaints, so windows stay invisible until they redraw.
fading = false;
frame-opacity = 1.0;
corner-radius = 10;
blur-kern = "3x3box";

#################################
#       General Settings        #
#################################

# "xrender" is the safe default and works everywhere (incl. VMs / software
# rendering). On NVIDIA proprietary drivers it can cause mouse/render lag and
# broken vsync — if you see that, switch to "glx".
backend = "xrender";
dithered-present = false;
vsync = false;
unredir-if-possible = false;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = false;
log-level = "warn";


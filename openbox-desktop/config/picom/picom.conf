shadow = true;
fading = true;
frame-opacity = 1.0;
corner-radius = 10;
blur-kern = "3x3box";

#################################
#       General Settings        #
#################################

# "xrender" is the safe default and works everywhere (incl. VMs / software
# rendering). On NVIDIA proprietary drivers it can cause mouse/render lag and
# broken vsync — if you see that, switch to "glx".
backend = "xrender";
dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "warn";


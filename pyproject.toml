[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-linux"
version = "0.1.0"
description = "Linux phone-side Android Auto protocol implementation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["protobuf>=4.21", "dbus-fast>=2.0"]

[tool.setuptools]
packages = ["aa-linux"]
